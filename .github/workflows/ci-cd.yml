name: Construcción y despliegue de una aplicación MVC a Azure
env:
  AZURE_WEBAPP_NAME: upt-awa-188
  DOTNET_VERSION: '8'
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      
      # TAREA: Escaneo de vulnerabilidades con SonarCloud
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: 17, distribution: 'zulu' }
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}.x' }
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: SonarCloud Begin
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
        run: dotnet sonarscanner begin /k:"TU_PROJECT_KEY" /o:"TU_ORGANIZACION" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" || true
      - name: Dotnet Build para SonarCloud
        run: dotnet build Shorten/Shorten.csproj
      - name: SonarCloud End
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
        run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}" || true

      # Build & Push de Docker
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}
      - name: 'Build Inventory Image'
        run: |
            docker build . --tag ghcr.io/${{github.actor}}/shorten:${{github.sha}}
            docker push ghcr.io/${{github.actor}}/shorten:${{github.sha}}

  deploy:
    permissions: { contents: none }
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Desplegar a Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/${{github.actor}}/shorten:${{github.sha}}
